<svg width="680" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>AWS Infrastructure Architecture Diagram</title>
  <desc>Terraform-provisioned AWS infrastructure including VPC, public and private subnets, EC2 instance, internet gateway, route table, security group, and S3 bucket.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; }
      .th { font-size: 14px; font-weight: 600; fill: #1a1a2e; }
      .ts { font-size: 12px; font-weight: 400; fill: #444; }
      .arr { stroke: #888; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- Internet -->
  <rect x="270" y="20" width="140" height="44" rx="8" fill="#e8e8e8" stroke="#aaa" stroke-width="0.5"/>
  <text class="th" x="340" y="47" text-anchor="middle">Internet</text>

  <!-- Arrow: Internet to IGW -->
  <line x1="340" y1="64" x2="340" y2="96" class="arr" marker-end="url(#arrow)"/>

  <!-- Internet Gateway -->
  <rect x="240" y="96" width="200" height="50" rx="8" fill="#d4f1e8" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="th" x="340" y="116" text-anchor="middle" fill="#085041">Internet gateway</text>
  <text class="ts" x="340" y="134" text-anchor="middle" fill="#0F6E56">terraform-igw</text>

  <!-- Arrow: IGW to VPC -->
  <line x1="340" y1="146" x2="340" y2="168" class="arr" marker-end="url(#arrow)"/>

  <!-- VPC container -->
  <rect x="30" y="168" width="620" height="330" rx="16" fill="#e6f1fb" stroke="#378ADD" stroke-width="1"/>
  <text class="th" x="50" y="194" fill="#0C447C">VPC — terraform-vpc (10.0.0.0/16)</text>

  <!-- Route Table -->
  <rect x="240" y="204" width="200" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="340" y="224" text-anchor="middle" fill="#26215C">Route table</text>
  <text class="ts" x="340" y="242" text-anchor="middle" fill="#534AB7">0.0.0.0/0 → IGW</text>

  <!-- Arrow: Route table to Public Subnet -->
  <line x1="340" y1="254" x2="340" y2="272" class="arr" marker-end="url(#arrow)"/>

  <!-- Public Subnet -->
  <rect x="50" y="272" width="360" height="200" rx="12" fill="#d4f1e8" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="th" x="70" y="296" fill="#085041">Public subnet (10.0.1.0/24)</text>

  <!-- Security Group -->
  <rect x="70" y="308" width="200" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text class="th" x="170" y="328" text-anchor="middle" fill="#412402">Security group</text>
  <text class="ts" x="170" y="348" text-anchor="middle" fill="#854F0B">HTTP :80, SSH :22</text>

  <!-- Arrow: SG to EC2 -->
  <line x1="170" y1="364" x2="170" y2="382" class="arr" marker-end="url(#arrow)"/>

  <!-- EC2 Instance -->
  <rect x="70" y="382" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="th" x="170" y="402" text-anchor="middle" fill="#4A1B0C">EC2 instance</text>
  <text class="ts" x="170" y="422" text-anchor="middle" fill="#993C1D">terraform-web-server (t3.micro)</text>

  <!-- Private Subnet -->
  <rect x="430" y="272" width="200" height="200" rx="12" fill="#e8e8e8" stroke="#888" stroke-width="0.5"/>
  <text class="th" x="450" y="296" fill="#333">Private subnet</text>
  <text class="ts" x="530" y="320" text-anchor="middle" fill="#555">10.0.2.0/24</text>
  <text class="ts" x="530" y="342" text-anchor="middle" fill="#555">No internet access</text>
  <text class="ts" x="530" y="362" text-anchor="middle" fill="#555">For databases,</text>
  <text class="ts" x="530" y="382" text-anchor="middle" fill="#555">internal services</text>

  <!-- Arrow: VPC to S3 -->
  <line x1="555" y1="498" x2="555" y2="518" class="arr" marker-end="url(#arrow)"/>

  <!-- S3 Bucket -->
  <rect x="460" y="518" width="190" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="555" y="538" text-anchor="middle" fill="#26215C">S3 bucket</text>
  <text class="ts" x="555" y="556" text-anchor="middle" fill="#534AB7">Terraform remote state</text>

  <!-- Terraform label -->
  <rect x="30" y="518" width="160" height="50" rx="8" fill="#e8e8e8" stroke="#aaa" stroke-width="0.5"/>
  <text class="th" x="110" y="538" text-anchor="middle" fill="#333">Terraform</text>
  <text class="ts" x="110" y="556" text-anchor="middle" fill="#555">terraform apply</text>

  <!-- Arrow: Terraform to S3 area -->
  <line x1="190" y1="543" x2="458" y2="543" class="arr" marker-end="url(#arrow)"/>
</svg>
